[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractlens"
version = "0.1.0"
description = "Grounded, self-verifying contract review agents built with Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk[extensions]==2.14.0",
    "litellm>=1.70",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "mlflow>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
gcp = ["google-cloud-bigquery>=3.20", "pyarrow>=15", "db-dtypes>=1.2", "google-cloud-documentai>=2.29", "google-cloud-storage>=2.16"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
